global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/irrigation_api_alerts.yml

scrape_configs:
  - job_name: "irrigation-need-api"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "irrigation-ml-latest.onrender.com"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: irrigation-need-prediction
  labels:
    app: irrigation-need-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irrigation-need-prediction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: irrigation-need-prediction
    spec:
      containers:
        - name: irrigation-ml-api
          image: ghcr.io/bhanuteja33/irrigation-ml:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

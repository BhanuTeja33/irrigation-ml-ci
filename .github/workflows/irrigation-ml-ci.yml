name: Irrigation ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train irrigation model
        run: python train_irrigation_model.py

      - name: Check irrigation quality gate
        run: python irrigation_quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_irrigation_ml.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t irrigation-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name irrigation-ml-container \
            -p 5000:5000 \
            irrigation-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs irrigation-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"soil_moisture":15,"temperature":40,"humidity":30,"rainfall_forecast_mm":0}' \
            http://localhost:5000/predict)
          echo "Dry/hot field response: $response"
          echo "$response" | grep -q '"prediction"'
          echo "$response" | grep -q 'IRRIGATE'

          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"soil_moisture":75,"temperature":15,"humidity":90,"rainfall_forecast_mm":25}' \
            http://localhost:5000/predict)
          echo "Wet/cool field response: $response"
          echo "$response" | grep -q '"prediction"'
          echo "$response" | grep -q 'SKIP'

      - name: Show Docker container logs
        if: always()
        run: docker logs irrigation-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f irrigation-ml-container || true

      - name: Upload validated irrigation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: irrigation-ml-artifacts-run-${{ github.run_number }}
          path: |
            irrigation_model.pkl
            metrics.json
            field_data.csv
          if-no-files-found: error
          retention-days: 5

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp irrigation_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Irrigation Need Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\nDocker: docker build -t irrigation-ml:1.0 .\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: irrigation-ml-release
          path: release_candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

